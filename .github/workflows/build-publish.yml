# Gates every push and pull request, and on main pushes the app image to GHCR. Rollout
# stays in coilyco/deploy. Mod ZIPs ship as release assets: docs/mod-packages.md.
name: build-publish

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: coilyco/agentic-os/actions/setup-ci@df1aee7cf7fd1c36c1eda3523291a76b0cdbbd35
        with:
          tools: just uv pre-commit trufflehog

      - run: just test
      - run: just lint
      - run: just smoke
      - run: just precommit --show-diff-on-failure

      - name: Alert Sentry on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_CI_DSN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/alert_sentry.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm via corepack
        run: COREPACK_ENABLE_DOWNLOAD_PROMPT=0 corepack enable

      - run: pnpm install --frozen-lockfile
        working-directory: frontend

      - run: pnpm lint
        working-directory: frontend

      - run: pnpm test
        working-directory: frontend

      - run: pnpm build
        working-directory: frontend

      - name: Alert Sentry on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_CI_DSN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/alert_sentry.py

  frontend-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build the frontend stage from the Docker context
        run: bash scripts/build-frontend-image.sh

      - name: Alert Sentry on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_CI_DSN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/alert_sentry.py

  kit-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: coilyco/agentic-os/actions/setup-ci@df1aee7cf7fd1c36c1eda3523291a76b0cdbbd35
        with:
          tools: uv

      - name: Enable pnpm via corepack
        run: COREPACK_ENABLE_DOWNLOAD_PROMPT=0 corepack enable

      - run: pnpm install --frozen-lockfile
        working-directory: frontend

      - run: pnpm build
        working-directory: frontend

      - name: Serve the built SPA from the fused service and run kit-check
        run: bash scripts/frontend-kit-check-ci.sh

      - name: Alert Sentry on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_CI_DSN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/alert_sentry.py

  build-image:
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test, frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Publish immutable application image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_FRONTEND_DSN }}
        run: bash scripts/publish-image.sh

      - name: Alert Sentry on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_CI_DSN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/alert_sentry.py

  publish-mods:
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build-image]
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Publish the mod ZIPs from the image as release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish-mod-from-image.sh

      - name: Alert Sentry on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_CI_DSN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/alert_sentry.py
