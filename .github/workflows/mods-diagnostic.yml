# Manual diagnostics for the C# Eco mods and their NuGet restore/build/test path. It is
# workflow_dispatch only, so a red C# path never makes normal push CI fail.
name: mods-diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mods:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: coilyco/agentic-os/actions/setup-ci@df1aee7cf7fd1c36c1eda3523291a76b0cdbbd35
        with:
          tools: just

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Toolchain + NuGet egress preflight
        run: sh scripts/mods-preflight.sh

      - name: Compile every C# Eco mod
        run: just build-mods

      - name: Run replay mod unit tests
        run: just test-mod-replay

      - name: Alert Sentry on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_CI_DSN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/alert_sentry.py
