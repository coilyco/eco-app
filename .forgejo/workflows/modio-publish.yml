name: modio-publish

# A deliberate promotion boundary: normal main builds neither call nor depend
# on mod.io. This workflow only uploads ZIP bytes already in Forgejo Packages.
on:
  workflow_dispatch:
    inputs:
      package:
        description: Forgejo package to promote
        required: true
        type: choice
        options:
          - eco-jobs-tracker
          - eco-replay
          - eco-store-exporter
          - eco-telemetry
      registry_version:
        description: Immutable Forgejo package version (for example 1.2.3+<full-sha>)
        required: true
        type: string
      archive_name:
        description: Exact ZIP filename from that Forgejo package version
        required: true
        type: string
      modio_game_id:
        description: mod.io game ID for this target (not stored in the repository)
        required: true
        type: string
      modio_mod_id:
        description: mod.io mod ID for this target (not stored in the repository)
        required: true
        type: string
      modio_file_id:
        description: Optional existing mod.io file ID to verify on a retry
        required: false
        type: string
      release_notes:
        description: Release notes sent as the mod.io file changelog
        required: false
        type: string
      dry_run:
        description: Verify Forgejo artifacts only; do not contact mod.io
        required: true
        default: true
        type: boolean

jobs:
  promote:
    runs-on: docker
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:release
    steps:
      - uses: actions/checkout@v4
      - name: Require promotion credentials
        env:
          FORGEJO_PACKAGE_TOKEN: ${{ secrets.ECO_MOD_PACKAGE_TOKEN }}
        run: sh scripts/require-secret.sh FORGEJO_PACKAGE_TOKEN
      - name: Require mod.io publisher credential
        if: ${{ !inputs.dry_run }}
        env:
          MODIO_ACCESS_TOKEN: ${{ secrets.MODIO_ACCESS_TOKEN }}
        run: sh scripts/require-secret.sh MODIO_ACCESS_TOKEN
      - name: Verify and promote the published package
        env:
          FORGEJO_PACKAGE_URL: ${{ github.server_url }}
          FORGEJO_PACKAGE_OWNER: coilyco
          FORGEJO_PACKAGE_USER: ${{ github.actor }}
          FORGEJO_PACKAGE_TOKEN: ${{ secrets.ECO_MOD_PACKAGE_TOKEN }}
          MOD_PACKAGE_NAME: ${{ inputs.package }}
          MOD_PACKAGE_VERSION: ${{ inputs.registry_version }}
          MOD_PACKAGE_ARCHIVE: ${{ inputs.archive_name }}
          MODIO_GAME_ID: ${{ inputs.modio_game_id }}
          MODIO_MOD_ID: ${{ inputs.modio_mod_id }}
          MODIO_FILE_ID: ${{ inputs.modio_file_id }}
          MODIO_ACCESS_TOKEN: ${{ secrets.MODIO_ACCESS_TOKEN }}
          MODIO_CHANGELOG: ${{ inputs.release_notes }}
          MODIO_DRY_RUN: ${{ inputs.dry_run }}
        run: python3 scripts/modio_publish.py
      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_RED_CHAT_ID }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          JOB: ${{ github.job }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          API_BASE: https://api.telegram.org
        run: python3 scripts/alert_telegram.py
