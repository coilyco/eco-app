name: mods-diagnostic

# Manual diagnostics for the C# Eco mods and their NuGet restore/build/test
# path. This workflow is intentionally workflow_dispatch only, so a red C# path
# never makes normal push CI fail.

on:
  workflow_dispatch:

jobs:
  mods:
    runs-on: docker
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:release
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain + NuGet egress preflight
        run: sh scripts/mods-preflight.sh
      - name: Compile every C# Eco mod
        run: just build-mods
      - name: Run replay mod unit tests
        run: just test-mod-replay
      - name: Alert Sentry on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_CI_DSN }}
        run: python3 scripts/alert_sentry.py
